plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = pluginGroup
version = pluginVersion

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    modern {
        compileClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.panda-lang.org/releases' }
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
    maven { url = 'https://repo.codemc.io/repository/maven-snapshots/' }
}

dependencies {
    compileOnly libs.paper.api

    implementation libs.litecommands.bukkit
    implementation libs.packetevents
    implementation libs.adventure.nbt
    implementation libs.bstats

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    modernCompileOnly libs.paper.api.modern
    modernCompileOnly libs.packetevents
    modernCompileOnly libs.lombok
    modernAnnotationProcessor libs.lombok
}

configurations.runtimeClasspath {
    exclude group: 'com.google.code.gson'
    exclude group: 'org.jetbrains', module: 'annotations'
}

configurations.compileClasspath {
    resolutionStrategy.eachDependency {
        if (requested.group == 'net.kyori' && requested.name.startsWith('adventure-') && requested.name != 'adventure-nbt') {
            useVersion(libs.versions.adventure.old.get())
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

compileJava {
    options.release.set(javaVer.toInteger())
}

compileModernJava {
    options.release.set(21)
}

processResources {
    filteringCharset = 'UTF-8'

    def props = [
            version: pluginVersion,
            name   : pluginName,
            main   : pluginMainClass
    ]
    inputs.properties props

    filesMatching('plugin.yml') {
        expand props
    }
}

def libsPackage = "${project.group}.paintcraft.lib"

shadowJar {
    from sourceSets.modern.output
    archiveBaseName.set(pluginName)
    archiveClassifier.set('')

    relocate 'dev.rollczi.litecommands', "${libsPackage}.litecommands"
    relocate 'net.dzikoysk', "${libsPackage}.panda"
    relocate 'panda.utilities', "${libsPackage}.panda.utilities"
    relocate 'panda.std', "${libsPackage}.panda.std"
    relocate 'com.github.retrooper.packetevents', "${libsPackage}.packetevents.api"
    relocate 'io.github.retrooper.packetevents', "${libsPackage}.packetevents.impl"
    relocate 'org.bstats', "${libsPackage}.bstats"

    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**'

    manifest {
        attributes 'paperweight-mappings-namespace': 'mojang'
    }
}

tasks.register('ruJar', Jar) {
    dependsOn tasks.shadowJar
    archiveBaseName.set(pluginName)
    archiveClassifier.set('ru')
    filteringCharset = 'UTF-8'

    manifest {
        attributes 'paperweight-mappings-namespace': 'mojang'
    }

    from(zipTree(tasks.shadowJar.archiveFile)) {
        exclude 'META-INF/MANIFEST.MF'
        filesMatching('config.yml') {
            filter { it.replace('language: en', 'language: ru') }
        }
    }
}

tasks.jar.enabled = false
tasks.build.dependsOn tasks.shadowJar, tasks.ruJar
