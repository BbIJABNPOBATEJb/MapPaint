name: ${name}
version: ${version}
main: ${main}
api-version: '1.20'
authors: [ BbIJABNPOBATEJb ]
website: https://github.com/BbIJABNPOBATEJb/MapPaint
description: Paint pictures right in the game, no resource pack needed. Export and import as a string.

permissions:
  mappaint.use:
    description: Paint, place canvases, /paint and the menus
    default: true
  mappaint.export:
    description: Export a painting as a string
    default: true
  mappaint.import:
    description: Import a painting from a string
    default: true
  mappaint.image:
    description: Import an image from a URL (/paint image)
    default: op
  mappaint.give:
    description: Give the brush and canvases with /paint give
    default: op
  mappaint.admin:
    description: Edit and remove other players' paintings, /paint reload, language and report, no limits and no costs
    default: op
    children:
      mappaint.use: true
      mappaint.export: true
      mappaint.import: true
      mappaint.image: true
      mappaint.give: true
