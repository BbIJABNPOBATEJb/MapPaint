# MapPaint — Italiano
#
# I {placeholders} tra parentesi graffe vengono riempiti dal plugin: lasciali così come sono.
# I colori sono tag MiniMessage: <gray>, <white>, <#FF7800>.
# Una chiave mancante in un altro file di lingua viene presa da questo.

language:
