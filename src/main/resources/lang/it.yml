      - "<white>/paint give brush|canvas [LxA] [quantità] [giocatore]"
      - "<white>/paint language [codice] <gray>lingua del plugin · <white>/paint reload"
      - "<white>/paint report [secondi] <gray>file di debug per segnalare un bug"

tool:
  brush:
    name: "Pennello"
    hint: "Tieni premuto clic dx e trascina sulla tela. Shift mantiene il tratto dritto."
  eraser:
    name: "Gomma"
    hint: "Cancella fino alla tela bianca."
  fill:
    name: "Riempimento"
    hint: "Riempie un'area di un solo colore."
  spray:
    name: "Spray"
    hint: "Spruzza punti: più tieni premuto, più è denso."
  line:
    name: "Linea"
    hint: "Tieni clic dx all'inizio, rilascia alla fine. Shift la allinea."
  rect:
    name: "Rettangolo"
    hint: "Trascina da un angolo all'altro. Shift fa un quadrato."
  ellipse:
    name: "Ellisse"
    hint: "Trascina come un rettangolo. Shift fa un cerchio."

item:
  brush:
    name: "<#FF7800>Pennello da artista"
    paint: "dipingere su una tela <gray>(si può tenere in mano)"
    pick: "prendere il colore da una tela o un blocco"
    palette: "tavolozza <gray>(fuori dalla tela)"
    shift-key: "Shift mentre dipingi"
