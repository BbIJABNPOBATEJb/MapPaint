    sketch-name: "Bozzetto"
    author: "Autore: <white>{name}"
    size: "Dimensione: <white>{size}"
    imported: "<#FFE100>Importato <dark_gray>» <gray>trasferito, non dipinto a mano"
    signed:
      - "<dark_gray>Dipinto + tela bianca {size}"
      - "<dark_gray>in un banco da lavoro fanno una copia."
    sketch:
      - "<dark_gray>Non firmato: si può ancora dipingere."
      - "<dark_gray># {id}"

