  changed: "<#1FFF5E>Idioma: <white>{language}"
  current: "<white>Idioma actual: <#FF7800>{language}"
  available: "<gray>Disponibles: <white>{languages}"
  unknown: "Idioma desconocido {input}. Disponibles: {languages}"

prefix: "Paint"

common:
