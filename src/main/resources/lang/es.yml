      - ""
      - "Un boceto tomado de aquí es la misma"
      - "pintura: los cambios se ven dondequiera"
      - "que esté colgada."
      - ""
      - "Las pinturas firmadas se copian en una"
      - "mesa de crafteo: pintura + lienzo en blanco."
