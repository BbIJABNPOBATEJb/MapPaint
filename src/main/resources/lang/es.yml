      - "<white>/paint undo <gray>· <white>redo <gray>· <white>clear"
      - "<white>/paint panel <gray>devolver las ventanas movidas a su sitio"
      - "<white>/paint export <gray>código de la pintura · <white>/paint import [código] <gray>pegar un código"
      - "<white>/paint sign [título] <gray>firmar: una pintura firmada se puede copiar"
      - "<white>/paint image [url] <gray>imagen de la web: recorte, zoom, desplazamiento"
      - "<white>/paint admin <gray>objetos del plugin y todas las pinturas del servidor"
      - "<white>/paint give brush|canvas [AnchoxAlto] [cantidad] [jugador]"
      - "<white>/paint language [código] <gray>idioma del plugin · <white>/paint reload"

tool:
  brush:
    name: "Pincel"
    hint: "Mantén clic der. y arrastra sobre el lienzo. Shift mantiene el trazo recto."
  eraser:
    name: "Borrador"
    hint: "Borra hasta dejar el lienzo en blanco."
  fill:
    name: "Relleno"
    hint: "Rellena una zona de un solo color."
  spray:
    name: "Spray"
    hint: "Esparce puntos: cuanto más mantienes, más denso."
  line:
    name: "Línea"
    hint: "Mantén clic der. al inicio y suelta al final. Shift la alinea."
  rect:
    name: "Rectángulo"
    hint: "Arrastra de esquina a esquina. Shift hace un cuadrado."
  ellipse:
    name: "Elipse"
    hint: "Arrastra como un rectángulo. Shift hace un círculo."

item:
  brush:
    name: "<#FF7800>Pincel de artista"
    paint: "pintar en un lienzo <gray>(se puede sostener)"
    pick: "tomar el color de un lienzo o bloque"
    palette: "paleta <gray>(fuera del lienzo)"
    shift-key: "Shift al pintar"
    shift: "línea recta, cuadrado, círculo"
    wheel-key: "Shift + rueda"
    wheel: "tamaño del pincel"
    undo: "deshacer"
    redo: "rehacer"
