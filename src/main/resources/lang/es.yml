      - "<#FF7800>Shift + clic der. fuera del lienzo <dark_gray>» <gray>paleta, <#FF7800>Shift + rueda <dark_gray>» <gray>tamaño del pincel"
      - "<#FF7800>Shift al pintar <dark_gray>» <gray>línea recta, cuadrado, círculo"
      - "<#FF7800>F <dark_gray>» <gray>deshacer, <#FF7800>Shift + F <dark_gray>» <gray>rehacer"
