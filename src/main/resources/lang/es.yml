      less: "más pequeño"
      shift: "Con Shift"
      by-four: "de 4 en 4"
    canvas:
      name: "Lienzo y mis pinturas"
      lore:
        - "Resolución, firma, exportación,"
        - "importación, lista de tus pinturas."
    help:
      - "<white>Con el pincel en la mano:"
      - "clic der. en un lienzo pinta,"
      - "clic izq. toma el color de un lienzo"
      - "o de cualquier bloque del mundo."
      - ""
      - "Shift + rueda cambia el tamaño del pincel."
      - "F deshace, Shift + F rehace."
      - ""
      - "Las formas se arrastran: mantén clic der.,"
      - "mueve y suelta."
      - "Con Shift la línea sale recta,"
      - "el rectángulo se vuelve cuadrado,"
      - "la elipse se vuelve círculo."

