      - "<dark_gray>Pintura + lienzo en blanco {size}"
      - "<dark_gray>en una mesa de crafteo hacen una copia."
    sketch:
      - "<dark_gray>Sin firmar: aún se puede pintar."
      - "<dark_gray># {id}"

painting:
