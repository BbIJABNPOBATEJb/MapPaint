# PaintCraft — Español
#
# Los {placeholders} entre llaves los rellena el plugin: déjalos tal cual.
# Los colores son etiquetas MiniMessage: <gray>, <white>, <#FF7800>.
# Si falta una clave en otro archivo de idioma, se usa la de este.

