    title: "Paleta y herramientas"
    page: "Colores: página {page} de {pages}"
    hex:
      name: "Color por código"
      lore:
        - "Escribe #RRGGBB: se elige el color"
        - "más cercano de la paleta."
      action: "escribir un código"
    transparent:
      - "Los píxeles desaparecen: la pared se ve"
      - "a través de la pintura. Útil para pegatinas"
      - "y pinturas de cualquier forma."
    shade:
      - "Tono del color seleccionado."
