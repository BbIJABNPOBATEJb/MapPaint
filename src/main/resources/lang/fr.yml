  open: "ouvrir"
  select: "choisir"
  take: "prendre"
  toggle: "basculer"

unit:
  canvas:
    one: "{count} toile 1×1"
    many: "{count} toiles 1×1"
  sheet:
    one: "{count} feuille"
    many: "{count} feuilles"
  painting:
    one: "{count} tableau"
    many: "{count} tableaux"

color:
  transparent: "Transparent"
  transparent-short: "transparent"

command:
  invalid-usage: "Utilisation incorrecte"
  player-only: "Réservé aux joueurs"
  usage-header: "<#FF7800>Utilisation de la commande :"
  usage: "<#FF1F1F>Utilisation : <white>{usage}"
