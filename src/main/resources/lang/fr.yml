  painting:
    sketch-name: "Esquisse"
    author: "Auteur : <white>{name}"
    size: "Taille : <white>{size}"
    imported: "<#FFE100>Import <dark_gray>» <gray>transféré, pas peint à la main"
    signed:
      - "<dark_gray>Tableau + toile vierge {size}"
      - "<dark_gray>dans une table de fabrication = copie."
    sketch:
      - "<dark_gray>Non signé : on peut encore peindre."
      - "<dark_gray># {id}"

painting:
  untitled: "Sans titre"
  signed: "<#FF7800>signé"
  sketch: "<white>esquisse"
  imported: " <gray>· <#FFE100>import"

hud:
