# PaintCraft — Français
#
# Les {placeholders} entre accolades sont remplis par le plugin : ne les modifiez pas.
# Les couleurs sont des balises MiniMessage : <gray>, <white>, <#FF7800>.
# Une clé absente d'un autre fichier de langue est reprise depuis celui-ci.

language:
  name: "Français"
  changed: "<#1FFF5E>Langue : <white>{language}"
  current: "<white>Langue actuelle : <#FF7800>{language}"
  available: "<gray>Disponibles : <white>{languages}"
  unknown: "Langue inconnue {input}. Disponibles : {languages}"

prefix: "Paint"

common:
  no-permission: "Vous n'avez pas la permission"
  color-format: "Une couleur s'écrit #RRGGBB, par exemple #FF8800"
  canvas-cleared: "<gray>Toile effacée. <dark_gray>F pour la récupérer"
  "on": "ACTIVÉ"
  "off": "DÉSACTIVÉ"

click:
  left: "clic gauche"
  right: "clic droit"

action:
