      - "<white>/paint color #RRGGBB <gray>· <white>size nombre <gray>· <white>tool nom"
      - "<white>/paint undo <gray>· <white>redo <gray>· <white>clear"
      - "<white>/paint panel <gray>remettre en place les fenêtres déplacées"
      - "<white>/paint export <gray>code du tableau · <white>/paint import [code] <gray>coller un code"
      - "<white>/paint sign [titre] <gray>signer : un tableau signé peut être copié"
      - "<white>/paint image [url] <gray>image du web : recadrage, zoom, décalage"
      - "<white>/paint admin <gray>objets du plugin et tous les tableaux du serveur"
      - "<white>/paint give brush|canvas [LxH] [quantité] [joueur]"
      - "<white>/paint language [code] <gray>langue du plugin · <white>/paint reload"

tool:
  brush:
    name: "Pinceau"
    hint: "Maintenez le clic droit et glissez sur la toile. Shift garde le trait droit."
  eraser:
    name: "Gomme"
    hint: "Efface jusqu'à la toile vierge."
  fill:
    name: "Remplissage"
    hint: "Remplit une zone d'une seule couleur."
  spray:
    name: "Bombe de peinture"
    hint: "Projette des points : plus on maintient, plus c'est dense."
  line:
    name: "Ligne"
    hint: "Maintenez le clic droit au début, relâchez à la fin. Shift l'aligne."
  rect:
    name: "Rectangle"
    hint: "Glissez d'un coin à l'autre. Shift donne un carré."
  ellipse:
    name: "Ellipse"
    hint: "Glissez comme pour un rectangle. Shift donne un cercle."

item:
  brush:
    name: "<#FF7800>Pinceau d'artiste"
    paint: "peindre sur une toile <gray>(peut être tenu)"
    pick: "prélever une couleur sur une toile ou un bloc"
    palette: "palette <gray>(hors de la toile)"
    shift-key: "Shift en peignant"
    shift: "ligne droite, carré, cercle"
    wheel-key: "Shift + molette"
    wheel: "taille du pinceau"
    undo: "annuler"
    redo: "rétablir"
  canvas:
    name: "Toile {size}"
