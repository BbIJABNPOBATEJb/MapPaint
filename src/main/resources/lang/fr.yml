      - "<#FF7800>clic droit <dark_gray>» <gray>peindre, <#FF7800>clic gauche <dark_gray>» <gray>prélever une couleur sur une toile ou un bloc"
      - "<#FF7800>Shift + clic droit hors de la toile <dark_gray>» <gray>palette, <#FF7800>Shift + molette <dark_gray>» <gray>taille du pinceau"
      - "<#FF7800>Shift en peignant <dark_gray>» <gray>ligne droite, carré, cercle"
      - "<#FF7800>F <dark_gray>» <gray>annuler, <#FF7800>Shift + F <dark_gray>» <gray>rétablir"
      - "<#FF7800>Q <dark_gray>» <gray>outil précédent, <#FF7800>Shift + Q <dark_gray>» <gray>outil suivant"
